<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Raymond 个人网页本地内容编辑后台。">
    <title>Local Admin | Raymond</title>
    <link rel="stylesheet" href="admin.css">
  </head>
  <body>
    <header class="admin-topbar">
      <a class="admin-brand" href="admin.html" aria-label="Local admin home">
        <span class="admin-mark" aria-hidden="true">R</span>
        <span>Content Admin</span>
      </a>
      <div class="topbar-actions">
        <span class="save-state" id="save-state">Loading content...</span>
        <a class="icon-button" href="index.html" target="_blank" rel="noreferrer" aria-label="Open site preview" title="Open site preview">↗</a>
        <button class="icon-button" type="button" id="reload-button" aria-label="Reload content" title="Reload content">↻</button>
        <button class="save-button" type="button" id="save-button">Save</button>
      </div>
    </header>

    <main class="admin-shell">
      <aside class="admin-sidebar" aria-label="Admin sections">
        <div class="lang-tabs" role="tablist" aria-label="Language">
          <button class="is-active" type="button" data-lang-tab="zh">中文</button>
          <button type="button" data-lang-tab="en">EN</button>
        </div>
        <nav class="section-tabs" id="section-tabs" aria-label="Content sections">
          <button class="is-active" type="button" data-section="overview">Overview</button>
          <button type="button" data-section="homepage">Homepage</button>
          <button type="button" data-section="projects">Projects</button>
          <button type="button" data-section="blog">Blog</button>
          <button type="button" data-section="contact">Contact</button>
          <button type="button" data-section="json">Raw JSON</button>
        </nav>
      </aside>

      <section class="editor-panel">
        <div class="panel-heading">
          <div>
            <p class="kicker" id="panel-kicker">Local content file</p>
            <h1 id="panel-title">Overview</h1>
          </div>
          <p class="panel-note" id="panel-note">Editing data/content.json</p>
        </div>

        <form id="editor-form" autocomplete="off"></form>
      </section>
    </main>

    <template id="field-template">
      <label class="field">
        <span></span>
        <input>
      </label>
    </template>

    <script src="admin.js"></script>
  </body>
</html>
